name: NoMount LKM advanced / bot
run-name: NoMount LKM · ${{ inputs.smoke_test && '测试绑定' || inputs.device_serial || (inputs.device_serial_sha256 && '摘要绑定')
  || '测试绑定' }} · ${{ inputs.build_request_id || github.run_id }}
'on':
  push:
    branches:
    - main
  workflow_dispatch:
    inputs:
      device_serial:
        description: Device serial, displayed in the run title, summary and ZIP name (hash-only builds show a digest label)
        required: false
        type: string
      device_serial_sha256:
        description: Optional SHA256 of the boot serial for hash-only builds
        required: false
        type: string
      build_request_id:
        description: Optional bot request ID for private build delivery
        required: false
        type: string
      smoke_test:
        description: Compile and package only; installer rejects the random test binding
        required: false
        default: false
        type: boolean
      diagnostic_stage:
        description: Diagnostic only; all builds five separate packages, begin with CORE
        required: false
        default: 'off'
        type: choice
        options:
        - 'off'
        - core
        - hooks
        - vfs
        - kernel
        - full
        - all
  workflow_call:
    secrets:
      NM_BINDING_PRIVATE_KEY:
        required: true
      SOURCE_REPOSITORY:
        required: true
      SOURCE_REVISION:
        required: true
      SOURCE_READ_KEY:
        required: true
    inputs:
      device_serial:
        required: false
        type: string
        default: ''
      device_serial_sha256:
        required: false
        type: string
        default: ''
      build_request_id:
        required: false
        type: string
        default: ''
      smoke_test:
        required: false
        type: boolean
        default: false
      diagnostic_stage:
        required: false
        type: string
        default: 'off'
permissions:
  contents: read
jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(inputs.diagnostic_stage == 'all' && '["core","hooks","vfs","kernel","full"]' || inputs.diagnostic_stage
          == 'core' && '["core"]' || inputs.diagnostic_stage == 'hooks' && '["hooks"]' || inputs.diagnostic_stage == 'vfs'
          && '["vfs"]' || inputs.diagnostic_stage == 'kernel' && '["kernel"]' || inputs.diagnostic_stage == 'full' && '["full"]'
          || '["off"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/lkm/kernel
      with:
        device_serial: ${{ inputs.device_serial }}
        device_serial_sha256: ${{ inputs.device_serial_sha256 }}
        build_request_id: ${{ inputs.build_request_id }}
        smoke_test: ${{ inputs.smoke_test }}
        diagnostic_stage: ${{ inputs.diagnostic_stage }}
        signing_key: ${{ secrets.NM_BINDING_PRIVATE_KEY }}
  suite:
    needs: kernel
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(inputs.diagnostic_stage == 'all' && '["core","hooks","vfs","kernel","full"]' || inputs.diagnostic_stage
          == 'core' && '["core"]' || inputs.diagnostic_stage == 'hooks' && '["hooks"]' || inputs.diagnostic_stage == 'vfs'
          && '["vfs"]' || inputs.diagnostic_stage == 'kernel' && '["kernel"]' || inputs.diagnostic_stage == 'full' && '["full"]'
          || '["off"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'true'
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/lkm/suite
      with:
        device_serial: ${{ inputs.device_serial }}
        device_serial_sha256: ${{ inputs.device_serial_sha256 }}
        build_request_id: ${{ inputs.build_request_id }}
        smoke_test: ${{ inputs.smoke_test }}
        diagnostic_stage: ${{ inputs.diagnostic_stage }}
