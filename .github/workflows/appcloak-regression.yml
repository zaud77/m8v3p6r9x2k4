name: NoMount AppCloak regression
'on':
  push:
    branches:
    - experiment/appcloak-hma173-20261002
    - codex/appcloak-upstream-complete
    paths:
    - appcloak/**
    - external/**
    - .gitmodules
    - module/**
    - kernel/**
    - tests/**
    - tools/generate_binding.py
    - tools/diagnostics/HookRuntimeProbe.java
    - .github/workflows/lkm*.yml
    - .github/workflows/appcloak-regression.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'true'
        privacy-key: ${{ secrets.BUILD_PRIVACY_KEY }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/appcloak-regression/backend
    - name: Save private encrypted build diagnostics
      if: ${{ always() && steps.pipeline.outcome != 'skipped' }}
      shell: bash
      run: python3 "$GITHUB_WORKSPACE/ci/run_pipeline_step.py" --publish-diagnostics
      env:
        DIAGNOSTICS_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        BUILD_DIAGNOSTICS_TOKEN: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
        DIAGNOSTICS_JOB_INDEX: ${{ strategy.job-index || 0 }}
