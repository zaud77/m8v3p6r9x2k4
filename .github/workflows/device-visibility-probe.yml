name: NoMount device visibility probes
'on':
  push:
    branches:
    - codex/appcloak-upstream-complete
    paths:
    - tools/diagnostics/device-visibility-probe/**
    - .github/workflows/device-visibility-probe.yml
  workflow_dispatch:
    inputs:
      native_only:
        description: Build only the native device probes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probes:
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        privacy-key: ${{ secrets.BUILD_PRIVACY_KEY }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/device-visibility-probe/probes
      with:
        native_only: ${{ inputs.native_only }}
        artifact_token: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
    - name: Save private encrypted build diagnostics
      if: ${{ always() && steps.pipeline.outcome != 'skipped' }}
      shell: bash
      run: python3 "$GITHUB_WORKSPACE/ci/run_pipeline_step.py" --publish-diagnostics
      env:
        DIAGNOSTICS_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        BUILD_DIAGNOSTICS_TOKEN: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
        DIAGNOSTICS_JOB_INDEX: ${{ strategy.job-index || 0 }}
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        privacy-key: ${{ secrets.BUILD_PRIVACY_KEY }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/device-visibility-probe/native
      with:
        native_only: ${{ inputs.native_only }}
        artifact_token: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
    - name: Save private encrypted build diagnostics
      if: ${{ always() && steps.pipeline.outcome != 'skipped' }}
      shell: bash
      run: python3 "$GITHUB_WORKSPACE/ci/run_pipeline_step.py" --publish-diagnostics
      env:
        DIAGNOSTICS_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
        BUILD_DIAGNOSTICS_TOKEN: ${{ secrets.BUILD_DIAGNOSTICS_TOKEN }}
        DIAGNOSTICS_JOB_INDEX: ${{ strategy.job-index || 0 }}
