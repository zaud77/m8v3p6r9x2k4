name: NoMount device visibility probes
'on':
  push:
    branches:
    - codex/appcloak-upstream-complete
    paths:
    - tools/diagnostics/device-visibility-probe/**
    - .github/workflows/device-visibility-probe.yml
  workflow_dispatch:
    inputs:
      native_only:
        description: Build only the native device probes
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probes:
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        privacy-key: ${{ secrets.BUILD_PRIVACY_KEY }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/device-visibility-probe/probes
      with:
        native_only: ${{ inputs.native_only }}
    - name: Save encrypted build diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: build-diagnostics-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build-private/logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Prepare pinned build inputs
      uses: ./.github/actions/private-inputs
      with:
        repository: ${{ secrets.SOURCE_REPOSITORY }}
        revision: ${{ secrets.SOURCE_REVISION }}
        key: ${{ secrets.SOURCE_READ_KEY }}
        submodules: 'false'
        privacy-key: ${{ secrets.BUILD_PRIVACY_KEY }}
    - name: Run private build pipeline
      id: pipeline
      uses: ./ci/actions/device-visibility-probe/native
      with:
        native_only: ${{ inputs.native_only }}
    - name: Save encrypted build diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: build-diagnostics-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/build-private/logs/*.enc
        if-no-files-found: ignore
        retention-days: 7
